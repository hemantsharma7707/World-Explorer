<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="World Explorer — Discover countries around the globe using the REST Countries API.">
  <title>World Explorer — Discover Countries</title>

  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Skeleton loading shimmer effect */
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    .dark .skeleton {
      background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
      background-size: 200% 100%;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>

  <!-- Tailwind Custom Config -->
  <script>
    // ======================================
    // 1. GLOBAL VARIABLES
    // ======================================
    let allCountries = [];

    // ======================================
    // 2. API FUNCTIONS (async/await + try/catch)
    // ======================================
    const PRIMARY_API = 'https://pw-d20261017a29.plainwork-apps.workers.dev/v3.1';
    const FALLBACK_API = 'https://restcountries.com/v3.1';

    async function apiRequest(path) {
      try {
        const res = await fetch(`${PRIMARY_API}${path}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (primaryErr) {
        console.warn('Primary API unavailable, attempting fallback...', primaryErr);
        const res = await fetch(`${FALLBACK_API}${path}`);
        if (!res.ok) throw new Error(`Fallback HTTP ${res.status}`);
        return await res.json();
      }
    }

    // Fetch all countries
    async function fetchAllCountries() {
      try {
        return await apiRequest('/all?fields=name,capital,population,region,subregion,flags,cca3,area');
      } catch (err) {
        console.error('Fetch all failed:', err);
        throw err;
      }
    }

    // Fetch one country by code (for detail page)
    async function fetchCountryByCode(code) {
      try {
        const data = await apiRequest(`/alpha/${code}`);
        return Array.isArray(data) ? data[0] : data;
      } catch (err) {
        console.error('Fetch country failed:', err);
        throw err;
      }
    }

    // Fetch multiple countries by codes (for border names)
    async function fetchBorderCountries(codes) {
      if (!codes || codes.length === 0) return [];
      try {
        return await apiRequest(`/alpha?codes=${codes.join(',')}&fields=name,cca3,flags`);
      } catch (err) {
        console.error('Fetch borders failed:', err);
        throw err;
      }
    }

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans min-h-screen transition-colors duration-300">

  <!-- ==================== NAVBAR ==================== -->
  <header class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-lg border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <!-- Logo -->
      <a href="#" id="logo" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center">
          <span class="text-white text-xl">🌍</span>
        </div>
        <h1 class="text-xl font-extrabold text-indigo-600">World Explorer</h1>
      </a>

      <!-- Nav Buttons -->
      <div class="flex items-center gap-2">
        <button id="favoritesBtn" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 transition-colors">
          ❤️ <span class="hidden sm:inline">Favorites</span>
          <span id="favCount" class="ml-1 px-1.5 py-0.5 bg-red-500 text-white text-xs rounded-full hidden">0</span>
        </button>
        <button id="compareBtn" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 transition-colors">
          ⚖️ <span class="hidden sm:inline">Compare</span>
        </button>
        <button id="darkModeBtn" class="w-10 h-10 rounded-lg flex items-center justify-center text-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
          🌙
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <section id="browseView">
      <!-- Search & Filter Controls -->
      <div class="flex flex-col sm:flex-row gap-3 mb-6">
        <input type="text" id="searchInput" placeholder="🔍 Search countries..."
          class="flex-1 px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">

        <select id="regionFilter"
          class="px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm cursor-pointer min-w-[150px]">
          <option value="">All Regions</option>
          <option value="Africa">Africa</option>
          <option value="Americas">Americas</option>
          <option value="Asia">Asia</option>
          <option value="Europe">Europe</option>
          <option value="Oceania">Oceania</option>
        </select>

        <select id="sortSelect"
          class="px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm cursor-pointer min-w-[180px]">
          <option value="">Default Order</option>
          <option value="name-asc">Name (A → Z)</option>
          <option value="name-desc">Name (Z → A)</option>
          <option value="pop-high">Population (High → Low)</option>
          <option value="pop-low">Population (Low → High)</option>
          <option value="area-high">Area (Largest first)</option>
          <option value="area-low">Area (Smallest first)</option>
        </select>
      </div>

      <!-- Result Count -->
      <p id="resultCount" class="text-sm text-gray-500 mb-4 hidden"></p>

      <!-- Loading Skeletons -->
      <div id="loadingDiv" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 hidden"></div>

      <!-- Error Message -->
      <div id="errorDiv" class="text-center py-20 hidden">
        <p class="text-6xl mb-4">😵</p>
        <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-2">Something went wrong</h2>
        <p id="errorMsg" class="text-gray-500 mb-6">Failed to load countries.</p>
        <button id="retryBtn" class="px-6 py-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-colors font-medium">Try Again</button>
      </div>

      <!-- Empty State (no results) -->
      <div id="emptyDiv" class="text-center py-20 hidden">
        <p class="text-6xl mb-4">🔍</p>
        <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-2">No countries found</h2>
        <p class="text-gray-500">Try a different search or filter.</p>
      </div>

      <!-- Countries Grid -->
      <div id="countriesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
    </section>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="border-t border-gray-200 dark:border-gray-800 mt-12 py-6 text-center text-sm text-gray-400">
    Built with ❤️ using <a href="https://restcountries.com/" target="_blank" class="text-indigo-500 hover:underline">REST Countries API</a> • World Explorer © 2026
  </footer>

  <script>
    function initDarkMode() {
      const saved = localStorage.getItem('darkMode');
      if (saved === 'true') {
        document.documentElement.classList.add('dark');
        document.getElementById('darkModeBtn').textContent = '☀️';
      }
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('darkMode', isDark);
      document.getElementById('darkModeBtn').textContent = isDark ? '☀️' : '🌙';
    }

    document.getElementById('darkModeBtn').addEventListener('click', toggleDarkMode);
    // UI State helpers
    function showLoading() {
      const div = document.getElementById('loadingDiv');
      div.innerHTML = '';
      div.classList.remove('hidden');
      document.getElementById('countriesGrid').classList.add('hidden');
      document.getElementById('errorDiv').classList.add('hidden');
      document.getElementById('emptyDiv').classList.add('hidden');

      for (let i = 0; i < 12; i++) {
        const card = document.createElement('div');
        card.className = 'rounded-2xl overflow-hidden bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700';
        card.innerHTML = '<div class="skeleton h-40 w-full" style="border-radius:0"></div><div class="p-4 space-y-3"><div class="skeleton h-5 w-3/4"></div><div class="skeleton h-4 w-1/2"></div><div class="skeleton h-4 w-2/3"></div></div>';
        div.appendChild(card);
      }
    }

    function showError(msg) {
      document.getElementById('loadingDiv').classList.add('hidden');
      document.getElementById('countriesGrid').classList.add('hidden');
      document.getElementById('emptyDiv').classList.add('hidden');
      document.getElementById('errorMsg').textContent = msg;
      document.getElementById('errorDiv').classList.remove('hidden');
    }

    function showEmpty() {
      document.getElementById('loadingDiv').classList.add('hidden');
      document.getElementById('countriesGrid').classList.add('hidden');
      document.getElementById('errorDiv').classList.add('hidden');
      document.getElementById('emptyDiv').classList.remove('hidden');
    }

    function formatNum(n) {
      return n != null ? n.toLocaleString('en-US') : 'N/A';
    }

    function createCard(country) {
      const card = document.createElement('div');
      card.className = 'country-card rounded-2xl overflow-hidden bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 cursor-pointer transition-all duration-300 hover:shadow-lg hover:-translate-y-1';
      card.dataset.code = country.cca3;

      const img = document.createElement('img');
      img.className = 'w-full h-40 object-cover';
      img.src = country.flags?.png || '';
      img.alt = `Flag of ${country.name.common}`;
      img.loading = 'lazy';

      const info = document.createElement('div');
      info.className = 'p-4';

      const name = document.createElement('h2');
      name.className = 'font-bold text-base mb-2 truncate';
      name.textContent = country.name.common;

      const pop = document.createElement('p');
      pop.className = 'text-sm text-gray-500 dark:text-gray-400';
      pop.innerHTML = `<span class="font-semibold text-gray-700 dark:text-gray-300">Population:</span> ${formatNum(country.population)}`;

      const cap = document.createElement('p');
      cap.className = 'text-sm text-gray-500 dark:text-gray-400';
      cap.innerHTML = `<span class="font-semibold text-gray-700 dark:text-gray-300">Capital:</span> ${country.capital?.[0] || 'N/A'}`;

      const reg = document.createElement('p');
      reg.className = 'text-sm text-gray-500 dark:text-gray-400';
      reg.innerHTML = `<span class="font-semibold text-gray-700 dark:text-gray-300">Region:</span> ${country.region || 'N/A'}`;

      info.appendChild(name);
      info.appendChild(pop);
      info.appendChild(cap);
      info.appendChild(reg);

      card.appendChild(img);
      card.appendChild(info);
      return card;
    }

    function renderCards(countries) {
      const grid = document.getElementById('countriesGrid');
      grid.innerHTML = '';
      if (countries.length === 0) {
        showEmpty();
        return;
      }
      document.getElementById('loadingDiv').classList.add('hidden');
      document.getElementById('errorDiv').classList.add('hidden');
      document.getElementById('emptyDiv').classList.add('hidden');
      grid.classList.remove('hidden');

      const fragment = document.createDocumentFragment();
      countries.forEach(c => fragment.appendChild(createCard(c)));
      grid.appendChild(fragment);
    }

    function debounce(fn, delay) {
      let timer;
      return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const region = document.getElementById('regionFilter').value;

      const sortBy = document.getElementById('sortSelect').value;

      let results = allCountries.filter(c => {
        const matchesName = c.name.common.toLowerCase().includes(search);
        const matchesRegion = !region || c.region === region;
        return matchesName && matchesRegion;
      });

      if (sortBy) {
        results.sort((a, b) => {
          if (sortBy === 'name-asc') return a.name.common.localeCompare(b.name.common);
          if (sortBy === 'name-desc') return b.name.common.localeCompare(a.name.common);
          if (sortBy === 'pop-high') return b.population - a.population;
          if (sortBy === 'pop-low') return a.population - b.population;
          if (sortBy === 'area-high') return (b.area || 0) - (a.area || 0);
          if (sortBy === 'area-low') return (a.area || 0) - (b.area || 0);
          return 0;
        });
      }

      const countEl = document.getElementById('resultCount');
      countEl.textContent = `Showing ${results.length} countries`;
      countEl.classList.remove('hidden');

      renderCards(results);
    }

    async function init() {
      initDarkMode();
      showLoading();
      try {
        allCountries = await fetchAllCountries();
        renderCards(allCountries);
        document.getElementById('searchInput').addEventListener('input', debounce(applyFilters, 350));
        document.getElementById('regionFilter').addEventListener('change', applyFilters);
        document.getElementById('sortSelect').addEventListener('change', applyFilters);
      } catch (err) {
        showError('Failed to load countries. Check your connection.');
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
