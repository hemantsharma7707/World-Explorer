<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="World Explorer — Discover countries around the globe using the REST Countries API.">
  <title>World Explorer — Discover Countries</title>

  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind Custom Config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans min-h-screen transition-colors duration-300">

  <!-- ==================== NAVBAR ==================== -->
  <header class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-lg border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <!-- Logo -->
      <a href="#" id="logo" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center">
          <span class="text-white text-xl">🌍</span>
        </div>
        <h1 class="text-xl font-extrabold text-indigo-600">World Explorer</h1>
      </a>

      <!-- Nav Buttons -->
      <div class="flex items-center gap-2">
        <button id="favoritesBtn" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 transition-colors">
          ❤️ <span class="hidden sm:inline">Favorites</span>
          <span id="favCount" class="ml-1 px-1.5 py-0.5 bg-red-500 text-white text-xs rounded-full hidden">0</span>
        </button>
        <button id="compareBtn" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 transition-colors">
          ⚖️ <span class="hidden sm:inline">Compare</span>
        </button>
        <button id="darkModeBtn" class="w-10 h-10 rounded-lg flex items-center justify-center text-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
          🌙
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <section id="browseView">
      <div class="text-center py-12 text-gray-500">
        Browse view initialized.
      </div>
    </section>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="border-t border-gray-200 dark:border-gray-800 mt-12 py-6 text-center text-sm text-gray-400">
    Built with ❤️ using <a href="https://restcountries.com/" target="_blank" class="text-indigo-500 hover:underline">REST Countries API</a> • World Explorer © 2026
  </footer>

  <script>
    function initDarkMode() {
      const saved = localStorage.getItem('darkMode');
      if (saved === 'true') {
        document.documentElement.classList.add('dark');
        document.getElementById('darkModeBtn').textContent = '☀️';
      }
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('darkMode', isDark);
      document.getElementById('darkModeBtn').textContent = isDark ? '☀️' : '🌙';
    }

    document.getElementById('darkModeBtn').addEventListener('click', toggleDarkMode);
    document.addEventListener('DOMContentLoaded', initDarkMode);
  </script>
</body>
</html>
